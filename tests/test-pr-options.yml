name: Test PR options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          source_repo_path: AndreasAugustin/actions-template-sync
          upstream_branch: main
          is_dry_run: "true"
          github_token: fake-token-for-coverage
          source_repo_ssh_private_key: ""
          pr_body: "This PR syncs changes from the template repository."
          pr_reviewers: "reviewer1,reviewer2"
        continue-on-error: true
      - name: Assert action ran with PR options
        run: |
          echo "Action completed with PR options in dry-run mode"
          echo "PASS"
