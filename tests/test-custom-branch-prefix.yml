name: Test custom branch prefix
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Install gh CLI if not present
        run: |
          if ! command -v gh &>/dev/null; then
            type -p curl >/dev/null || (apt-get update && apt-get install -y curl)
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | \
              dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
            chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | \
              tee /etc/apt/sources.list.d/github-cli.list > /dev/null
            apt-get update && apt-get install -y gh
          fi
          gh --version

      - name: Set up git origin reachable locally
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: action
        uses: .
        with:
          source_repo_path: actions/hello-world-javascript-action
          upstream_branch: main
          is_dry_run: "true"
          steps: "prechecks"
          pr_branch_name_prefix: "custom/sync"
          git_user_name: "test-user"
          git_user_email: "test@example.com"

      - name: Assert pr_branch uses custom prefix
        env:
          PR_BRANCH: ${{ steps.action.outputs.pr_branch }}
        run: |
          echo "pr_branch: $PR_BRANCH"
          if [[ "$PR_BRANCH" != custom/sync* ]]; then
            echo "FAIL: expected pr_branch to start with 'custom/sync', got '$PR_BRANCH'"
            exit 1
          fi
          echo "PASS: pr_branch has correct custom prefix"

      - name: Assert template_git_hash is set
        env:
          TEMPLATE_GIT_HASH: ${{ steps.action.outputs.template_git_hash }}
        run: |
          echo "template_git_hash: $TEMPLATE_GIT_HASH"
          if [ -z "$TEMPLATE_GIT_HASH" ]; then
            echo "FAIL: expected template_git_hash to be non-empty"
            exit 1
          fi
          echo "PASS: template_git_hash is '$TEMPLATE_GIT_HASH'"
