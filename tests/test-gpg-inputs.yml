name: Test gpg_private_key and gpg_passphrase inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up mock gh CLI and pre-fetch source repo
        run: |
          mkdir -p /tmp/mock-bin
          printf '#!/bin/bash\nexit 0\n' > /tmp/mock-bin/gh
          chmod +x /tmp/mock-bin/gh
          echo "/tmp/mock-bin" >> "$GITHUB_PATH"
          git config --global credential.helper ""
          git fetch https://github.com/actions/checkout HEAD

      - id: action
        uses: .
        with:
          source_repo_path: actions/checkout
          upstream_branch: main
          is_dry_run: "true"
          steps: "prechecks"
          git_user_name: "test-user"
          git_user_email: "test@example.com"
          gpg_private_key: ""
          gpg_passphrase: ""

      - name: Assert action completed with gpg inputs
        run: |
          echo "PASS: action completed with gpg_private_key and gpg_passphrase inputs"
