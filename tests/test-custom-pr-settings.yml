name: Test custom PR settings with dry-run
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git origin reachable inside the action
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: action
        uses: .
        continue-on-error: true
        with:
          source_repo_path: AndreasAugustin/actions-template-sync
          source_branch: main
          is_dry_run: "true"
          pr_branch_name_prefix: "chore/custom_sync"
          pr_title: "Custom PR title for template sync"
          pr_body: "Custom body for template sync PR"
          pr_labels: "template_sync,automated"
          pr_commit_msg: "chore(template): custom merge message"
          git_user_name: "Custom Bot"
          git_user_email: "custom-bot@example.com"

      - name: Assert action ran with custom settings
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PR_BRANCH: ${{ steps.action.outputs.pr_branch }}
          TEMPLATE_GIT_HASH: ${{ steps.action.outputs.template_git_hash }}
        run: |
          echo "outcome: $OUTCOME"
          echo "pr_branch: $PR_BRANCH"
          echo "template_git_hash: $TEMPLATE_GIT_HASH"
          if [ "$OUTCOME" = "success" ]; then
            # Verify that pr_branch starts with the custom prefix
            if [ -n "$PR_BRANCH" ] && echo "$PR_BRANCH" | grep -q "^chore/custom_sync"; then
              echo "PASS: pr_branch has correct custom prefix: $PR_BRANCH"
            elif [ -n "$TEMPLATE_GIT_HASH" ]; then
              echo "PASS: action succeeded with template_git_hash=$TEMPLATE_GIT_HASH"
            else
              echo "FAIL: action succeeded but outputs are empty"
              exit 1
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo or network issue)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
