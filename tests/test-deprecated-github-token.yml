name: Test deprecated github_token input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up mock gh CLI and pre-fetch source repo
        run: |
          mkdir -p /tmp/mock-bin
          printf '#!/bin/bash\nexit 0\n' > /tmp/mock-bin/gh
          chmod +x /tmp/mock-bin/gh
          echo "/tmp/mock-bin" >> "$GITHUB_PATH"
          git config --global credential.helper ""
          git fetch https://github.com/actions/checkout HEAD

      - id: action
        uses: .
        with:
          source_repo_path: actions/checkout
          upstream_branch: main
          is_dry_run: "true"
          steps: "prechecks"
          git_user_name: "test-user"
          git_user_email: "test@example.com"
          github_token: ${{ github.token }}

      - name: Assert action completed with deprecated github_token input
        run: |
          echo "PASS: action completed with deprecated github_token input"
