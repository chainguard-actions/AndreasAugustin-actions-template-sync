name: Test dry-run basic
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          source_repo_path: AndreasAugustin/actions-template-sync
          upstream_branch: main
          is_dry_run: "true"
          pr_body: "Test PR body for dry run"
          pr_reviewers: ""
          git_user_name: "test-bot"
          git_user_email: "test-bot@example.com"
          git_remote_pull_params: "--allow-unrelated-histories"
        continue-on-error: true
      - name: Assert action ran
        run: |
          echo "Action completed (dry run mode)"
          echo "PASS"
