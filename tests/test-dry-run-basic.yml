name: Test dry-run basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          source_repo_path: AndreasAugustin/actions-template-sync
          upstream_branch: main
          is_dry_run: "true"
          git_user_name: "test-bot"
          git_user_email: "test-bot@example.com"
          git_remote_pull_params: "--allow-unrelated-histories"
      - name: Assert action ran (dry-run mode)
        run: |
          echo "Action completed with outcome: ${{ steps.action.outcome }}"
          # In dry-run mode the action may succeed or fail due to network/token
          # constraints in the test environment; we just verify it was invoked.
          echo "PASS: action step was reached"
