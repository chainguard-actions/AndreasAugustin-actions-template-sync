name: Test missing source_repo_path fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_SERVER_URL: https://github.com
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action without source_repo_path and expect failure
        id: action
        uses: .
        with:
          source_gh_token: dummy-token
          target_gh_token: dummy-token
          source_repo_path: ""
          is_dry_run: "true"
        continue-on-error: true

      - name: Assert action failed due to missing source_repo_path
        if: always()
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when source_repo_path is empty, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when source_repo_path was missing"
