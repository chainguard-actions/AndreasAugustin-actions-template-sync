name: Test missing required input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          # source_repo_path is intentionally omitted (required input)
          is_dry_run: "true"

      - name: Assert action failed due to missing source_repo_path
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed when source_repo_path is missing"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed without source_repo_path"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
